name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar, testar e verificar cobertura
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Guardar JAR e relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-istm-build-${{ github.run_number }}
          path: |
            target/*.jar
            target/site/jacoco/**
          if-no-files-found: warn
