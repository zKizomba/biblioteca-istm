spring.application.name=biblioteca-istm
spring.thymeleaf.cache=false
server.port=8080
library.loan.duration-days=${LIBRARY_LOAN_DURATION_DAYS:14}
library.penalty.suspension-days=${LIBRARY_SUSPENSION_DAYS:7}
biblioteca.security.admin.username=${BIBLIOTECA_ADMIN_USERNAME:admin}
biblioteca.security.admin.password=${BIBLIOTECA_ADMIN_PASSWORD:}
biblioteca.security.librarian.username=${BIBLIOTECA_LIBRARIAN_USERNAME:bibliotecario}
biblioteca.security.librarian.password=${BIBLIOTECA_LIBRARIAN_PASSWORD:}
