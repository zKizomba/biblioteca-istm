<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(active)" class="sidebar">
    <a class="brand" th:href="@{/}">
        <img th:src="@{/images/istm-official-logo.png}" alt="Logótipo oficial do ISTM" width="42" height="42">
        <span class="brand-copy"><small>ISTM · SISTEMA BIBLIOTECÁRIO</small><b>Biblioteca</b></span>
    </a>
    <div class="nav-label">BIBLIOTECA</div>
    <nav class="nav-links" aria-label="Navegação principal">
        <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? ' active' : ''"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Painel geral</a>
        <a th:href="@{/livros}" th:classappend="${active == 'books'} ? ' active' : ''"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20M8 7h8m-8 4h8"/></svg>Acervo</a>
        <a th:href="@{/leitores}" th:classappend="${active == 'readers'} ? ' active' : ''"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0m1-11a3.5 3.5 0 0 1 0 6.8M18 16a5 5 0 0 1 3.5 4"/></svg>Leitores</a>
        <a th:href="@{/emprestimos}" th:classappend="${active == 'loans'} ? ' active' : ''"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h13l-3-3m3 3-3 3M17 17H4l3 3m-3-3 3-3"/></svg>Empréstimos</a>
        <a th:href="@{/suspensoes}" th:classappend="${active == 'suspensions'} ? ' active' : ''"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg>Atrasos e suspensões</a>
        <a th:if="${currentRole == 'ADMIN'}" th:href="@{/admin/utilizadores}" th:classappend="${active == 'staff'} ? ' active' : ''"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4 21a8 8 0 0 1 16 0m-8-13V2m-3 3h6"/></svg>Contas e privilégios</a>
    </nav>
    <div class="sidebar-foot"><span class="shield-mini">✓</span><span>Acesso institucional protegido</span></div>
</aside>
<header th:fragment="topbar(pageTitle)" class="topbar">
    <div class="title-wrap"><span class="eyebrow">INSTITUTO SUPERIOR TÉCNICO MILITAR</span><h1 th:text="${pageTitle}">Painel</h1></div>
    <div class="topbar-user"><span class="avatar" th:text="${#strings.substring(currentUser, 0, 1).toUpperCase()}">I</span><span class="user-details"><b th:text="${currentUser}">utilizador</b><small th:text="${currentRole == 'ADMIN' ? 'Administrador' : 'Bibliotecário'}">Bibliotecário</small></span><form th:action="@{/logout}" method="post"><button class="logout-button" type="submit" aria-label="Terminar sessão" title="Terminar sessão"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg></button></form></div>
</header>
<div th:fragment="flashMessages" class="flash-stack">
    <div th:if="${success}" class="flash success" role="status" th:text="${success}"></div>
    <div th:if="${error}" class="flash error" role="alert" th:text="${error}"></div>
</div>
</body>
</html>
